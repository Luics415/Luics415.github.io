name: Monitor de Salud de Enlaces y Documentos (Zero 404)

on:
  schedule:
    # Ejecución semanal los lunes a las 9:00 AM UTC (después de la auditoría)
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar-enlaces:
    name: Verificación de Enlaces y Documentos
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar verificación Zero 404
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        shell: bash
        run: |
          python .github/scripts/check_broken_links.py
